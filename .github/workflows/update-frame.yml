name: Update /frame

on:
  # GitHub Actions' own schedule trigger proved unreliable for this repo
  # (see frame/cron-worker/README.md) and was removed in favor of a
  # Cloudflare Worker calling workflow_dispatch hourly.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node frame/generate-weather.js

      - run: node frame/generate-transit.js
        env:
          TRANSIT_511_API_KEY: ${{ secrets.TRANSIT_511_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- frame/weather.js frame/transit.js; then
            echo "No change"
          else
            git add frame/weather.js frame/transit.js
            git commit -m "Update /frame weather and transit"
            git push
          fi
