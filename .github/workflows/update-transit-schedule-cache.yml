name: Update transit schedule cache

# AC Transit's published schedule changes on the order of every few months
# (a "sign-up"/service change), not daily -- unlike update-frame.yml's
# every-15-minutes cadence, this only needs to run occasionally. Run monthly
# and let workflow_dispatch cover an ad-hoc refresh if a schedule change is
# known to have happened.
on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download and extract AC Transit GTFS feed
        env:
          TRANSIT_511_API_KEY: ${{ secrets.TRANSIT_511_API_KEY }}
        run: |
          curl -sSf "https://api.511.org/transit/datafeeds?api_key=$TRANSIT_511_API_KEY&operator_id=AC" -o /tmp/ac-gtfs.zip
          mkdir -p /tmp/ac-gtfs
          unzip -o -q /tmp/ac-gtfs.zip -d /tmp/ac-gtfs
          ls -la /tmp/ac-gtfs

      - run: node frame/generate-transit-schedule-cache.js /tmp/ac-gtfs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- frame/transit-schedule-cache.json; then
            echo "No change"
          else
            git add frame/transit-schedule-cache.json
            git commit -m "Update AC Transit schedule cache"
            git push
          fi
