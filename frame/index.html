<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=1600, height=1200, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Frame</title>

    <!-- via favicon.io -->
    <link rel="icon" href="/favicon.ico">

    <link href="/frame/style.css" rel="stylesheet">
</head>
<body>
    <div class="frame">
        <img class="frame__image" id="frame-image" alt="" referrerpolicy="no-referrer">
        <canvas class="frame__canvas" id="frame-canvas"></canvas>

        <canvas class="frame__header-canvas" id="frame-header-canvas" role="img"></canvas>
        <canvas class="frame__footer-canvas" id="frame-footer-canvas" role="img"></canvas>
    </div>

    <!-- All type="module" (dither.js needs static import for the vendored
         epdoptimize library) — module scripts are deferred and execute in
         relative document order, same guarantee this pipeline needs
         classic scripts for, so every script here is one for consistency
         rather than mixing execution-order semantics. -->
    <script type="module" src="/frame/data.js"></script>
    <script type="module" src="/frame/weather.js"></script>
    <script type="module" src="/frame/dither.js"></script>
    <script type="module" src="/frame/text-canvas.js"></script>
    <script type="module" src="/frame/render.js"></script>
</body>
</html>
