<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=1600, height=1200, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Frame</title>

    <!-- via favicon.io -->
    <link rel="icon" href="/favicon.ico">

    <link href="/frame/style.css" rel="stylesheet">
</head>
<body>
    <div class="frame">
        <header class="frame__header">
            <h1 class="frame__title" id="frame-title"></h1>
            <p class="frame__subtitle" id="frame-subtitle"></p>
        </header>

        <div class="frame__image-wrap">
            <img class="frame__image" id="frame-image" alt="">
        </div>

        <footer class="frame__footer">
            <p class="frame__body" id="frame-body"></p>
        </footer>
    </div>

    <script src="/frame/data.js"></script>
    <script src="/frame/render.js"></script>
</body>
</html>
